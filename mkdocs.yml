# Project information
site_name: Data Science Interview preparation
site_author: SourceStrongAI
site_description: >-
  This is a completely open-source platform for
  maintaining curated list of interview questions
  and answers for people looking and preparing
  for data science opportunities.
site_url: https://dsprep.com/

# Repository
repo_name: datascienceinterviews/datascienceinterviews.github.io
repo_url: https://github.com/datascienceinterviews/datascienceinterviews.github.io

hooks:
  - hooks/generate_questions_json.py

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
  - javascripts/xfile.js
extra_css:
  - 'stylesheets/extra.css'
extra:
  generator: false

  social:
    - icon: octicons/mark-github-16
      link: https://github.com/datascienceinterviews
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/company/sourcestrongai
    - icon: fontawesome/brands/x-twitter
      link: https://x.com/sourcestrongai
    - icon: octicons/globe-16
      link: https://sourcestrongai.com

  analytics:
    provider: google
    property: G-CMC251LQT6

  # consent:
  #   title: Cookie Consent <br><small>Help Us ✌️, Help You 🫵</small>
  #   actions:
  #     - accept
  #     - manage
  #   cookies:
  #     analytics:
  #       name: Google
  #       checked: true
  #     github:
  #       name: GitHub
  #       checked: true
  #   description: >- 
  #     We use cookies to recognize your repeated visits and preferences, improve and offer better services🤗
  #     <br>
  #     With your consent🤝, you're helping us to give you better experience. 
  #     <br>
  #     <a herf="https://dsprep.com/privacy">Read about privacy policy here<a>

theme:
  name: material
  custom_dir: overrides
  language: en
  favicon: https://repository-images.githubusercontent.com/275878203/13719500-bb75-11ea-8f3a-be2ffb87a6a2

  features:
    # - announce.dismiss
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    - search.highlight
    - search.share
    - search.suggest
    - content.tooltips
    - navigation.instant.progress
    - navigation.path
    - navigation.top
    - toc.follow

  icon:
    logo: fontawesome/solid/terminal
    repo: fontawesome/brands/git-alt

  palette:

    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode

    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      primary: deep purple
      accent: purple
      scheme: default 
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      primary: deep purple
      accent: purple
      scheme: slate
      toggle:
        icon: material/weather-night
        name: Switch to system preference
#plugins
plugins:
  # - social  # Requires: pip install "mkdocs-material[imaging]"
  # - meta  # Requires MkDocs Material Insiders (paid)
  # - optimize
  - glightbox
  - enumerate-headings:
        toc_depth: 6
        strict: true
        increment_across_pages: false
        include:
          - "Interview-Questions/*"
          - "Cheat-Sheets/*"
        exclude:
          - "Interview-Questions/Interview-Questions.md"
          - "Interview-Questions/data-structures-algorithms.md"
          - "Interview-Questions/Machine-Learning.md"
          - "Interview-Questions/System-design.md"
          - "Interview-Questions/Natural-Language-Processing.md"
          - "Interview-Questions/Probability.md"
          - "Interview-Questions/AB-testing.md"
          - "Interview-Questions/SQL-Interview-Questions.md"
          - "Interview-Questions/Python.md"
          - "Interview-Questions/Pandas.md"
          - "Interview-Questions/NumPy.md"
          - "Interview-Questions/Scikit-Learn.md"
          - "Interview-Questions/LangChain.md"
          - "Interview-Questions/LangGraph.md"
          - "Interview-Questions/TensorFlow.md"
          - "Interview-Questions/PyTorch.md"
          - "Interview-Questions/Forward-Deployed-Engineer.md"
        #   - another_page.md
        restart_increment_after:
          - Interview-Questions/*"
  - search:
      lang:
        - en
  # - privacy:
      # cache: false
  # - git-revision-date-localized:
  #     type: date
  - minify:
      minify_html: true
  - mkdocs-jupyter: #https://github.com/danielfrg/mkdocs-jupyter
      execute: false
  - with-pdf:
      enabled_if_env: ENABLE_PDF_EXPORT
      cover_logo: https://repository-images.githubusercontent.com/275878203/13719500-bb75-11ea-8f3a-be2ffb87a6a2
      copyright: Copyright © 2020 - 2026 SourceStrongAI
      cover_title: The Data Science Book
      cover_subtitle: https://dsprep.com
      output_path: /workspace/datascienceinterviews.github.io/pdf_output/DataScience.pdf
      back_cover: true

markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.inlinehilite
  - pymdownx.magiclink
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tilde
  - meta
  - codehilite
  - admonition
  - pymdownx.details
  - pymdownx.superfences

